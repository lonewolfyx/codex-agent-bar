name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    env:
      SPARKLE_PUBLIC_ED_KEY: "YBH74wFdhN0pdRj+e2NrVcUJ448H0C/O70uv5plgjXo="
      SPARKLE_PRIVATE_KEY: "efDHQvDteJeEgmw95eeqS3RbP6oy/XQBo632A4O5xag="
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        shell: bash
        run: ./scripts/build-dmg.sh --version "${{ steps.release.outputs.version }}"
        env:
          SIGN_APP: "1"
          CODE_SIGN_IDENTITY: "-"

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)

          if [ "${#dmgs[@]}" -ne 1 ]; then
            printf 'Expected exactly one DMG in dist, found %s:\n' "${#dmgs[@]}" >&2
            printf ' - %s\n' "${dmgs[@]:-<none>}" >&2
            exit 1
          fi

          if [ ! -s "${dmgs[0]}" ]; then
            echo "DMG is empty: ${dmgs[0]}" >&2
            exit 1
          fi

          dmg_path="${dmgs[0]}"
          dmg_name="$(basename "$dmg_path")"
          app_name="${dmg_name%-${{ steps.release.outputs.version }}.dmg}"

          echo "path=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "name=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"
          ls -lh "$dmg_path"

      - name: Verify DMG contents
        shell: bash
        run: |
          set -euo pipefail

          dmg_path="${{ steps.dmg.outputs.path }}"
          mount_dir="$(mktemp -d)"

          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT

          hdiutil verify "$dmg_path"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$dmg_path" >/dev/null

          app_path="$mount_dir/${{ steps.dmg.outputs.app_name }}.app"
          if [ ! -d "$app_path" ]; then
            echo "Expected app bundle not found: $app_path" >&2
            echo "Mounted DMG contents:" >&2
            find "$mount_dir" -maxdepth 1 -mindepth 1 -print >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign -dv --verbose=4 "$app_path"

          bundled_public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app_path/Contents/Info.plist")"
          if [ "$bundled_public_key" != "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "Bundled SUPublicEDKey does not match SPARKLE_PUBLIC_ED_KEY" >&2
            exit 1
          fi

          if ! spctl --assess --type execute --verbose=4 "$app_path"; then
            echo "::warning::Gatekeeper rejected this app because the release is ad-hoc signed and not notarized."
          fi

      - name: Generate Sparkle appcast
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/update-appcast.sh \
            --dmg "${{ steps.dmg.outputs.path }}" \
            --output "$RUNNER_TEMP/appcast.xml" \
            --tag "${{ steps.release.outputs.tag }}"

          grep -F 'sparkle:edSignature=' "$RUNNER_TEMP/appcast.xml"
          grep -F 'releases/download/${{ steps.release.outputs.tag }}/${{ steps.dmg.outputs.name }}' \
            "$RUNNER_TEMP/appcast.xml"

      - name: Create GitHub Release
        run: npx --yes genereleaselog@latest --output false --assets "${{ steps.dmg.outputs.path }}"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Verify release asset
        shell: bash
        run: |
          gh release view "${{ steps.release.outputs.tag }}" \
            --json assets \
            --jq '.assets[].name' \
            | grep -Fx "${{ steps.dmg.outputs.name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Sparkle appcast
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/appcast.xml" appcast.xml

          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "chore: update appcast for ${{ steps.release.outputs.tag }}"
          git push origin HEAD:main
